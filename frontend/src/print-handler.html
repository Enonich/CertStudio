<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Print</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        #pdf-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }

        @media print {
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: white;
            }

            body {
                overflow: visible;
                display: block;
            }

            #pdf-container {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: white;
                display: block;
                page-break-after: always;
            }

            iframe {
                border: none;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                display: block;
            }
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            font-size: 14px;
            z-index: 1000;
        }

        .loading::before {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">Loading certificate...</div>
    <div id="pdf-container"></div>

    <script>
        // Get the PDF URL from the query parameter
        const params = new URLSearchParams(window.location.search);
        const pdfUrl = params.get('pdf');

        // Only accept blob: URLs created by this app (same origin, memory-backed)
        const isSafeUrl = pdfUrl && /^blob:[^\s]+$/.test(pdfUrl) &&
            new URL(pdfUrl).origin === window.location.origin;

        if (isSafeUrl) {
            // Create iframe to display PDF
            const iframe = document.createElement('iframe');
            iframe.src = pdfUrl;
            iframe.id = 'pdf-iframe';
            
            // Wait for PDF to load, then trigger print
            let printTriggered = false;
            
            iframe.onload = () => {
                // Remove loading indicator
                const loading = document.querySelector('.loading');
                if (loading) {
                    loading.style.display = 'none';
                }
                
                // Trigger print after a short delay to ensure PDF is rendered
                if (!printTriggered) {
                    printTriggered = true;
                    // Set print parameters before printing
                    setTimeout(() => {
                        try {
                            // Configure print settings
                            window.print();
                        } catch (e) {
                            console.error('Print failed:', e);
                        }
                    }, 500);
                }
            };

            // Set a fallback timeout to print if onload doesn't trigger
            setTimeout(() => {
                if (!printTriggered) {
                    printTriggered = true;
                    const loading = document.querySelector('.loading');
                    if (loading) {
                        loading.textContent = 'Opening print dialog...';
                    }
                    try {
                        window.print();
                    } catch (e) {
                        console.error('Print fallback failed:', e);
                    }
                }
            }, 3000);

            document.getElementById('pdf-container').appendChild(iframe);
        } else {
            document.querySelector('.loading').textContent = pdfUrl
                ? 'Error: Invalid PDF source.'
                : 'Error: No PDF URL provided';
        }

        // Listen for print cancel
        window.addEventListener('beforeprint', () => {
            // Ensure proper scale before printing
            console.log('Print dialog opened');
        });

        window.addEventListener('afterprint', () => {
            // Close window after printing
            window.close();
        });
    </script>
</body>
</html>
